name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Struktur Proyek & Gabungkan Override
        run: |
          flutter create temp_app
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/
          cp -r android_overrides/app/* temp_app/android/app/

      - name: Install Dependencies & Build APK
        working-directory: temp_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: cam-count-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
