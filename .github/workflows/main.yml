name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Struktur Proyek & Gabungkan Override
        run: |
          flutter create --project-name cam_count temp_app
          rm -rf temp_app/lib
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/
          cp -r android_overrides/* temp_app/android/
          if [ -f temp_app/android/app/build.gradle ]; then
            rm -f temp_app/android/app/build.gradle.kts
          fi

      - name: Install Dependencies & Patch SDK Plugin
        working-directory: temp_app
        run: |
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 35/g; s/compileSdk 33/compileSdk 35/g; s/compileSdk = 33/compileSdk = 35/g' {} +

      - name: Build APK
        working-directory: temp_app
        run: |
          flutter build apk --release

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: cam-count-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
